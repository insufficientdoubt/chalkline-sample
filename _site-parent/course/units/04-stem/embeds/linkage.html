<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Linkages</title>
<link rel="stylesheet" href="embed.css">
<link rel="stylesheet" href="jsxgraph/jsxgraph.css">
<style>
  body { font-size: 16px; }
  .main { flex: 1; min-height: 0; display: grid; grid-template-columns: 1fr 290px; gap: 10px; }
  #board { min-height: 0; border: 1px solid var(--line); border-radius: var(--r); }
  .panel { min-height: 0; overflow: auto; display: flex; flex-direction: column; gap: 8px; padding: 10px; }
  .row { display: grid; grid-template-columns: 82px 1fr 38px; align-items: center; gap: 6px; }
  .row b { font-weight: 700; } .row span { text-align: right; font-variant-numeric: tabular-nums; }
  .row[hidden] { display: none; }
  .kind { padding: 8px 10px; border-radius: var(--r-sm); background: var(--surface); border: 1px solid var(--line); }
  .kind strong { display: block; font-size: 18px; }
  .rule { font-variant-numeric: tabular-nums; }
  .ok { color: var(--ok); } .no { color: var(--bad); }
  button { min-height: 34px; padding: 0 10px; font-size: 15px; }
  .presets { display: flex; flex-wrap: wrap; gap: 6px; }
  .c-ground { color: #5b6b80; } .c-crank { color: #0087ff; } .c-coupler { color: #d6458f; } .c-rocker { color: #23824a; } .c-extra { color: #ff8c0f; }
</style>
</head>
<body>
  <div class="bar">
    <button class="on" data-mode="four">4-bar</button>
    <button data-mode="watt">6-bar (Watt)</button>
    <button data-mode="stephenson">6-bar (Stephenson)</button>
    <span class="grow"></span>
    <button class="primary" id="play">❚❚ Pause</button>
    <button id="clearPath">Clear path</button>
  </div>
  <div class="main">
    <div id="board" class="jxgbox"></div>
    <div class="panel box">
      <div class="kind"><strong id="kind"></strong><span id="kindText" class="note"></span></div>
      <div class="rule" id="rule"></div>
      <div class="label">Try</div>
      <div class="presets" id="presets"></div>
      <div class="label">Link lengths</div>
      <div class="row"><b class="c-ground">Ground</b><input type="range" id="g" min="1" max="6" step="0.1"><span id="g-v"></span></div>
      <div class="row"><b class="c-crank">Crank</b><input type="range" id="a" min="0.5" max="5" step="0.1"><span id="a-v"></span></div>
      <div class="row"><b class="c-coupler">Coupler</b><input type="range" id="b" min="0.5" max="6" step="0.1"><span id="b-v"></span></div>
      <div class="row"><b class="c-rocker">Rocker</b><input type="range" id="c" min="0.5" max="6" step="0.1"><span id="c-v"></span></div>
      <div class="row"><b>Path point</b><input type="range" id="d" min="0" max="6" step="0.1"><span id="d-v"></span></div>
      <div class="row"><b>…its angle</b><input type="range" id="phi" min="-90" max="90" step="5"><span id="phi-v"></span></div>
      <div class="row extra"><b class="c-extra">Link 5</b><input type="range" id="e" min="0.5" max="6" step="0.1"><span id="e-v"></span></div>
      <div class="row extra"><b class="c-extra">Link 6</b><input type="range" id="f" min="0.5" max="6" step="0.1"><span id="f-v"></span></div>
    </div>
  </div>

<!-- JSXGraph (MIT or LGPL): see jsxgraph/LICENSE.MIT -->
<script src="jsxgraph/jsxgraphcore.js"></script>
<script>
  /*
    A four-bar linkage: two pivots on the ground, O2 and O4. The crank (O2–A) turns; the coupler
    (A–B) joins it to the rocker (O4–B). B is where a circle round A (the coupler's length) meets a
    circle round O4 (the rocker's length). The path point P rides on the coupler and draws a curve.

    Six-bars add two more links (link 5 and link 6) and a third ground pivot, O6. Joint F hangs
    from link 5 and from link 6 (to O6):
      Watt: the rocker gets an arm (a three-joint piece O4–B–E), and link 5 runs from E to F.
      Stephenson: link 5 runs from the path point P on the coupler to F.
  */
  const S = { mode: "four", playing: true, theta: 0.6, dir: 1, branch: 1, branch2: 1,
              O2: [0, 0], A: [0, 0], B: [0, 0], P: [0, 0], E: [0, 0], F: [0, 0], O6: [0, 0], ok: true };
  const L = {};   // link lengths, from the sliders
  const KEYS = ["g", "a", "b", "c", "d", "phi", "e", "f"];

  const PRESETS = {
    four: [
      { name: "Crank-rocker", v: { g: 4, a: 1.2, b: 3.6, c: 2.6, d: 2.2, phi: 35 } },
      { name: "Double-crank", v: { g: 1, a: 2.6, b: 3, c: 3.2, d: 1.6, phi: 30 } },
      { name: "Double-rocker", v: { g: 4, a: 3, b: 1.2, c: 3.3, d: 0.6, phi: 0 } },
      { name: "Parallelogram", v: { g: 3.5, a: 1.5, b: 3.5, c: 1.5, d: 1.75, phi: 0 } },
      { name: "Straight line", v: { g: 2, a: 1, b: 2.5, c: 2.5, d: 5, phi: 0 } },
    ],
    watt: [{ name: "Watt six-bar", v: { g: 4, a: 1.2, b: 3.6, c: 2.6, d: 2.2, phi: 35, e: 2.6, f: 2.2 } }],
    stephenson: [{ name: "Stephenson six-bar", v: { g: 4, a: 1.2, b: 3.6, c: 2.6, d: 2.2, phi: 35, e: 3.4, f: 3 } }],
  };

  /* ---- Geometry ---- */
  const len = function (p, q) { return Math.hypot(q[0] - p[0], q[1] - p[1]); };
  // Where a circle round p (radius r) meets a circle round q (radius s): both answers, or null.
  function meet(p, r, q, s) {
    const d = len(p, q);
    if (d > r + s || d < Math.abs(r - s) || d === 0) return null;
    const x = (r * r - s * s + d * d) / (2 * d), h = Math.sqrt(Math.max(0, r * r - x * x));
    const ux = (q[0] - p[0]) / d, uy = (q[1] - p[1]) / d;
    const bx = p[0] + x * ux, by = p[1] + x * uy;
    return [[bx - h * uy, by + h * ux], [bx + h * uy, by - h * ux]];
  }
  // The answer nearest to where the joint was: a real linkage can't jump to its mirror image.
  function nearest(both, prev) { return len(both[0], prev) <= len(both[1], prev) ? both[0] : both[1]; }
  function along(p, q, dist, deg) {   // a point dist from p, turned deg from the direction p→q
    const t = Math.atan2(q[1] - p[1], q[0] - p[0]) + deg * Math.PI / 180;
    return [p[0] + dist * Math.cos(t), p[1] + dist * Math.sin(t)];
  }

  const O4 = function () { return [L.g, 0]; };
  function solve(theta, first) {
    const A = [L.a * Math.cos(theta), L.a * Math.sin(theta)];
    const both = meet(A, L.b, O4(), L.c);
    if (!both) return false;
    const B = first ? both[0] : nearest(both, S.B);   // first time: the "open" way, above the ground
    const P = along(A, B, L.d, L.phi);
    let E = null, F = null;
    if (S.mode !== "four") {
      E = S.mode === "watt" ? along(O4(), B, L.c, -70) : P;   // Watt: an arm on the rocker. Stephenson: the path point
      const two = meet(E, L.e, S.O6, L.f);
      if (!two) return false;
      F = first ? (two[0][1] > two[1][1] ? two[0] : two[1]) : nearest(two, S.F);
    }
    S.A = A; S.B = B; S.P = P; S.E = E || S.E; S.F = F || S.F;
    return true;
  }

  /* ---- Drawing ---- */
  JXG.Options.text.fontSize = 16;
  const board = JXG.JSXGraph.initBoard("board", { boundingbox: [-4, 5, 9, -4], axis: false, grid: false, keepaspectratio: true,
    showCopyright: false, showNavigation: false, pan: { enabled: false }, zoom: { enabled: false } });
  const at = function (name, i) { return function () { const p = name === "O4" ? O4() : S[name]; return p[i]; }; };
  const P = function (name, opts) { return board.create("point", [at(name, 0), at(name, 1)], Object.assign({ fixed: true, name: "", size: 4, strokeColor: "#10233f", fillColor: "#fff", strokeWidth: 2 }, opts)); };
  const ground = { size: 7, face: "^", strokeColor: "#5b6b80", fillColor: "#5b6b80", label: { offset: [-8, -22], strokeColor: "#5b6b80" } };
  const pO2 = P("O2", Object.assign({ name: "O₂" }, ground)), pO4 = P("O4", Object.assign({ name: "O₄" }, ground));
  const pO6 = P("O6", Object.assign({ name: "O₆", visible: function () { return S.mode !== "four"; } }, ground));
  const pA = P("A", { name: "A", label: { offset: [-18, 12] } }), pB = P("B", { name: "B" });
  const pP = P("P", { size: 5, fillColor: "#d6458f", strokeColor: "#d6458f", name: "P" });
  const six = function () { return S.mode !== "four"; };
  const pE = P("E", { visible: function () { return S.mode === "watt"; } }), pF = P("F", { name: "F", visible: six });
  const link = function (p, q, color, w, vis) { return board.create("segment", [p, q], { strokeColor: color, strokeWidth: w || 8, lineCap: "round", visible: vis === undefined ? true : vis, fixed: true, highlight: false }); };
  link(pO2, pO4, "#c3ccd8", 3).setAttribute({ dash: 2 });
  // the coupler is a triangle (A, B and the path point): one rigid piece
  board.create("polygon", [pA, pB, pP], { fillColor: "#d6458f", fillOpacity: 0.12, borders: { strokeColor: "#d6458f", strokeWidth: 3, highlight: false }, vertices: { visible: false }, fixed: true, highlight: false });
  link(pA, pB, "#d6458f");
  link(pO2, pA, "#0087ff");
  link(pO4, pB, "#23824a");
  // Watt: the rocker is a three-joint piece (O4, B, E)
  board.create("polygon", [pO4, pB, pE], { fillColor: "#23824a", fillOpacity: 0.15, borders: { strokeColor: "#23824a", strokeWidth: 3, highlight: false }, vertices: { visible: false }, fixed: true, highlight: false, visible: function () { return S.mode === "watt"; } });
  link(pE, pF, "#ff8c0f", 7, function () { return S.mode === "watt"; });
  link(pP, pF, "#ff8c0f", 7, function () { return S.mode === "stephenson"; });
  link(pO6, pF, "#ff8c0f", 7, six);
  // the paths: the path point's (pink), and in a six-bar, F's (orange)
  const pathP = { x: [], y: [] }, pathF = { x: [], y: [] };
  board.create("curve", [pathP.x, pathP.y], { strokeColor: "#d6458f", strokeWidth: 2, dash: 0, highlight: false });
  board.create("curve", [pathF.x, pathF.y], { strokeColor: "#ff8c0f", strokeWidth: 2, highlight: false });
  function clearPath() { [pathP, pathF].forEach(function (p) { p.x.length = 0; p.y.length = 0; }); }

  /* ---- What kind of four-bar is it? (Grashof's rule) ---- */
  function kind() {
    const links = [["ground", L.g], ["crank", L.a], ["coupler", L.b], ["rocker", L.c]];
    const sorted = links.slice().sort(function (x, y) { return x[1] - y[1]; });
    const s = sorted[0], l = sorted[3], pq = sorted[1][1] + sorted[2][1], sl = s[1] + l[1];
    const f = function (n) { return (Math.round(n * 10) / 10).toString(); };
    let name, text;
    if (Math.abs(sl - pq) < 0.05) { name = "Change point"; text = "Right on the edge: it can flip into its mirror shape."; }
    else if (sl > pq) { name = "Triple-rocker"; text = "No link can turn all the way round. The crank only swings."; }
    else if (s[0] === "crank") { name = "Crank-rocker"; text = "The crank turns all the way round. The rocker swings back and forth."; }
    else if (s[0] === "ground") { name = "Double-crank"; text = "Both the crank and the rocker turn all the way round."; }
    else if (s[0] === "coupler") { name = "Double-rocker"; text = "The coupler can turn fully, but the crank and rocker only swing."; }
    else { name = "Rocker-crank"; text = "The rocker turns all the way round; the crank only swings."; }
    document.getElementById("kind").textContent = (S.mode === "four" ? "" : "Its first four-bar: ") + name;
    document.getElementById("kindText").textContent = text;
    const ok = sl <= pq + 0.05;
    document.getElementById("rule").innerHTML = "<b>Grashof's rule:</b> shortest + longest ≤ the other two<br>" +
      f(s[1]) + " + " + f(l[1]) + " = " + f(sl) + (ok ? " ≤ " : " > ") + f(pq) + ' <b class="' + (ok ? "ok" : "no") + '">' + (ok ? "✓ one link turns fully" : "✗ nothing turns fully") + "</b>";
  }

  /* ---- Controls ---- */
  function read() {
    KEYS.forEach(function (k) { L[k] = +document.getElementById(k).value; document.getElementById(k + "-v").textContent = k === "phi" ? L[k] + "°" : L[k]; });
  }
  // A view that fits the whole motion: run the linkage through a full turn (without drawing),
  // note where every joint goes, then zoom to that.
  function fit() {
    const saved = JSON.stringify(S), xs = [0, L.g], ys = [0, 0];
    if (S.mode !== "four") { xs.push(S.O6[0]); ys.push(S.O6[1]); }
    for (let i = 0; i < 520 && S.ok; i++) {
      const next = S.theta + S.dir * 0.025;
      if (solve(next, false)) S.theta = next; else S.dir = -S.dir;
      ["A", "B", "P"].concat(S.mode === "four" ? [] : ["E", "F"]).forEach(function (k) { xs.push(S[k][0]); ys.push(S[k][1]); });
    }
    Object.assign(S, JSON.parse(saved));
    const el = document.getElementById("board"), aspect = el.clientHeight / Math.max(el.clientWidth, 1);
    let left = Math.min.apply(null, xs) - 0.7, right = Math.max.apply(null, xs) + 0.7;
    let bottom = Math.min.apply(null, ys) - 0.9, top = Math.max.apply(null, ys) + 0.7;
    const w = right - left, hgt = top - bottom;
    if (hgt / w > aspect) { const extra = hgt / aspect - w; left -= extra / 2; right += extra / 2; }
    else { const extra = w * aspect - hgt; bottom -= extra / 2; top += extra / 2; }
    board.setBoundingBox([left, top, right, bottom], true);
  }
  function restart() {
    read();
    S.O6 = S.mode === "watt" ? [L.g + 3.4, 1] : [L.g + 1.6, 3.4];
    clearPath();
    let t = S.theta, okay = false;
    for (let i = 0; i < 360 && !okay; i++) { okay = solve(t, true); if (!okay) t += Math.PI / 180; }
    S.theta = t; S.ok = okay;
    kind(); fit(); board.update();
  }
  KEYS.forEach(function (k) { document.getElementById(k).addEventListener("input", restart); });
  function preset(v) { Object.keys(v).forEach(function (k) { document.getElementById(k).value = v[k]; }); S.theta = 0.6; S.dir = 1; restart(); }
  function setMode(m) {
    S.mode = m;
    document.querySelectorAll("[data-mode]").forEach(function (b) { b.classList.toggle("on", b.dataset.mode === m); });
    document.querySelectorAll(".row.extra").forEach(function (r) { r.hidden = m === "four"; });
    const box = document.getElementById("presets");
    box.textContent = "";
    PRESETS[m].forEach(function (p) { const btn = document.createElement("button"); btn.textContent = p.name; btn.onclick = function () { preset(p.v); }; box.append(btn); });
    preset(PRESETS[m][0].v);
  }
  document.querySelectorAll("[data-mode]").forEach(function (b) { b.onclick = function () { setMode(b.dataset.mode); }; });
  const play = document.getElementById("play");
  play.onclick = function () { S.playing = !S.playing; play.textContent = S.playing ? "❚❚ Pause" : "▶ Play"; };
  document.getElementById("clearPath").onclick = function () { clearPath(); board.update(); };

  /* ---- Moving ---- */
  // The crank turns a little each frame. If the linkage can't close (a link is too short to
  // reach), it has hit a dead end: the crank turns back, like a real one would rock.
  function step() {
    if (S.playing && S.ok) {
      const next = S.theta + S.dir * 0.025;
      if (solve(next, false)) S.theta = next;
      else S.dir = -S.dir;
      pathP.x.push(S.P[0]); pathP.y.push(S.P[1]);
      if (S.mode !== "four") { pathF.x.push(S.F[0]); pathF.y.push(S.F[1]); }
      if (pathP.x.length > 900) { pathP.x.shift(); pathP.y.shift(); pathF.x.shift(); pathF.y.shift(); }
      board.update();
    }
    requestAnimationFrame(step);
  }
  window.addEventListener("resize", function () { board.resizeContainer(document.getElementById("board").clientWidth, document.getElementById("board").clientHeight, false, true); fit(); });
  setMode(new URLSearchParams(location.search).get("mode") || "four");
  requestAnimationFrame(step);
</script>
</body>
</html>
