title: Chalkline
author: Chalkline
version: 0.1.0
quarto-required: ">=1.6.0"
contributes:
  shortcodes:
    - shortcodes.lua
    - pdf-viewer/pdf-viewer.lua
  filters:
    - path: video-shape.lua   # before shortcodes run: marks each video tall or wide
      at: pre-ast
    - filter.lua
  # A course's _quarto.yml says `project: type: chalkline` to get these. Its own settings are merged
  # on top: lists (like a theme) add to these, so the course's own styles load after Chalkline's.
  # Paths here are inside this extension.
  project:
    project:
      type: website
    format:
      html:
        theme: [cosmo, styles/styles.scss]
        include-after-body: styles/type-colors.html   # color-codes slide decks and packets in tables
      revealjs:
        theme: [default, styles/revealjs.scss]   # "default": no Google Fonts imports ("simple" pulls in two)
      typst:
        font-paths: [fonts/print]   # Fredoka, Patrick Hand, and Noto Sans SC for Chinese in PDFs
        template-partials:          # Chalkline's page layouts (worksheets, posters, playful)
          - typst/typst-template.typ
          - typst/typst-show.typ
