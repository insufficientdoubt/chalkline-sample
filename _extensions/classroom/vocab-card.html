<!-- Vocab pop-ups for {{< vocab "term" >}}: hover, keyboard focus or tap a term to see its card. -->
<style>
.vocab-term { position: relative; border-bottom: 2px dotted #0087ff; cursor: help; white-space: nowrap; }
.vocab-term:focus { outline: 2px solid #0087ff; outline-offset: 2px; border-radius: 3px; }
.vocab-card { display: none; position: absolute; z-index: 100; left: 50%; bottom: calc(100% + 10px); transform: translateX(-50%);
  width: 240px; padding: 10px 12px 12px; background: #fff; color: #1F2933; border: 1px solid #c6d0da; border-radius: 12px;
  box-shadow: 0 8px 24px rgba(0, 52, 119, .18); font: 15px/1.35 system-ui, -apple-system, "PingFang SC", sans-serif;
  text-align: left; white-space: normal; cursor: auto; }
.vocab-card::after { content: ""; position: absolute; left: 0; right: 0; top: 100%; height: 12px; }  /* lets the mouse reach the card */
.vocab-card.below { bottom: auto; top: calc(100% + 10px); }
.vocab-card.below::after { top: auto; bottom: 100%; }
.vocab-term:hover > .vocab-card, .vocab-term:focus-within > .vocab-card, .vocab-term.open > .vocab-card { display: block; }
.vocab-card img { display: block; width: 100%; height: 150px; object-fit: contain; background: #fff; margin: 0 0 6px; border-radius: 8px; }
.reveal .vocab-card img { margin: 0 0 6px; max-height: 150px; }
.vocab-card .vc-term { display: block; font-weight: 700; color: #003477; font-size: 17px; }
.vocab-card .vc-zh { font-weight: 500; color: #52606d; font-size: 15px; margin-left: 4px; }
.vocab-card .vc-def { display: block; margin-top: 3px; }
.vocab-card .vc-link { display: inline-block; margin-top: 6px; font-size: 13px; color: #0068c4; font-weight: 600; text-decoration: none; }
</style>
<script>
(function () {
  // Show the card below the word when there's no room above it, and keep it on screen sideways.
  function place(term) {
    var card = term.querySelector(".vocab-card");
    card.classList.remove("below"); card.style.left = ""; card.style.transform = "";
    var r = card.getBoundingClientRect();
    if (r.top < 8) card.classList.add("below");
    r = card.getBoundingClientRect();
    if (r.left < 8) { card.style.left = "0"; card.style.transform = "none"; }
    else if (r.right > window.innerWidth - 8) { card.style.left = "auto"; card.style.right = "0"; card.style.transform = "none"; }
  }
  document.addEventListener("mouseover", function (e) {
    var t = e.target.closest && e.target.closest(".vocab-term");
    if (t && !t.contains(e.relatedTarget)) requestAnimationFrame(function () { place(t); });
  });
  document.addEventListener("focusin", function (e) {
    var t = e.target.closest && e.target.closest(".vocab-term");
    if (t) requestAnimationFrame(function () { place(t); });
  });
  // Touch screens: tap a term to open its card, tap anywhere else to close it.
  document.addEventListener("click", function (e) {
    if (e.target.closest(".vc-link")) return;
    var t = e.target.closest(".vocab-term");
    document.querySelectorAll(".vocab-term.open").forEach(function (o) { if (o !== t) o.classList.remove("open"); });
    if (t) { t.classList.toggle("open"); requestAnimationFrame(function () { place(t); }); }
  });
})();
</script>
