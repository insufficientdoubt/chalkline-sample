unit: 3
unit_title: Göbekli Tepe
terms:
- term: archaeologist
  definition: A scientist who learns about the past from things people left behind.
  example: The archaeologist brushed the dirt off a carved stone.
  notes: Archaeologists study old tools, buildings, bones and seeds. German and Turkish archaeologists have worked at Göbekli Tepe since 1995.
  zh: 考古学家
  image: GBT-001.svg
  vex_id: GBT-001
- term: excavation
  definition: Careful digging to find and study things from the past.
  example: The excavation found four big stone circles.
  notes: Archaeologists dig slowly, layer by layer, and write down where every object lies. Only about one tenth of Göbekli Tepe has been excavated.
  zh: 发掘
  image: GBT-002.svg
  vex_id: GBT-002
- term: artifact
  definition: An object that people made or used long ago.
  example: This flint blade is an artifact from the Stone Age.
  notes: Tools, beads, bowls and statues are all artifacts. At Göbekli Tepe, archaeologists have found thousands of flint tools and grinding stones.
  zh: 文物
  image: GBT-003.svg
  vex_id: GBT-003
- term: evidence
  definition: Facts or objects that show whether an idea is true.
  example: Burnt seeds are evidence of what people ate.
  notes: Archaeologists test their ideas with evidence such as bones, seeds and tools. When new evidence is found, ideas can change.
  zh: 证据
  image: GBT-004.svg
  vex_id: GBT-004
- term: hunter-gatherer
  definition: A person who gets food by hunting wild animals and gathering wild plants.
  example: Hunter-gatherers followed the gazelle herds every summer.
  notes: For most of human history, everyone lived this way. The builders of Göbekli Tepe hunted gazelle and gathered wild grain and nuts.
  zh: 狩猎采集者
  image: GBT-005.svg
  vex_id: GBT-005
- term: Neolithic
  definition: The New Stone Age, when people began to farm and live in villages.
  example: Göbekli Tepe was built early in the Neolithic.
  notes: In Southwest Asia, the Neolithic began about 12,000 years ago. People still used stone tools, not metal. Göbekli Tepe was built at its very start.
  zh: 新石器时代
  image: GBT-006.svg
  vex_id: GBT-006
- term: farming
  definition: Growing plants and raising animals for food.
  example: Farming let people stay in one place all year.
  notes: 'Some of the world''s first farms grew in this region. But at Göbekli Tepe itself there is no clear evidence of farming: the grain was wild.'
  zh: 农耕
  image: GBT-007.svg
  vex_id: GBT-007
- term: megalith
  definition: A very large stone used to build a monument.
  example: Moving a megalith takes many people and strong ropes.
  notes: In Greek, mega means big and lith means stone. Göbekli Tepe's megaliths are more than 6,000 years older than Stonehenge.
  zh: 巨石
  image: GBT-008.svg
  vex_id: GBT-008
- term: T-pillar
  definition: A tall stone shaped like a T, carved to look like a person.
  example: Two big T-pillars stand in the middle of each circle.
  notes: The top of the T is the head and the long part is the body. Some have carved arms, hands and belts. The tallest are about 5.5 m.
  zh: T形石柱
  image: GBT-009.svg
  vex_id: GBT-009
- term: enclosure
  definition: A round stone building with T-pillars set in its wall.
  example: Enclosure D has the tallest pillars.
  notes: Each enclosure is 10 to 30 m across. A ring of pillars stands in the wall, with two big pillars in the middle. Four have been dug up so far.
  zh: 环形建筑
  image: GBT-010.svg
  vex_id: GBT-010
- term: relief
  definition: A carving that stands out from a flat stone surface.
  example: The relief shows a fox ready to jump.
  notes: The carver cuts away the stone around a shape, so the shape sticks out. Göbekli Tepe's reliefs show foxes, boars, snakes, vultures and scorpions.
  zh: 浮雕
  image: GBT-011.svg
  vex_id: GBT-011
- term: quarry
  definition: A place where people cut stone out of the ground.
  example: The workers dragged the stone from the quarry.
  notes: The pillars were cut from the limestone hill right next to the site, using flint tools. One unfinished pillar, about 7 m long, still lies in the quarry.
  zh: 采石场
  image: GBT-012.svg
  vex_id: GBT-012
