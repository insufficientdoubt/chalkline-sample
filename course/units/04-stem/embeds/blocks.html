<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blocks and Python</title>
<link rel="stylesheet" href="embed.css">
<style>
  .main { flex: 1; min-height: 0; display: grid; grid-template-columns: 1.55fr 1fr; gap: 10px; }
  #blocks { min-height: 0; border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
  .side { min-height: 0; display: grid; grid-template-rows: auto 1fr auto 0.7fr; gap: 6px; }
  pre { margin: 0; padding: 10px 12px; overflow: auto; font: 17px/1.4 ui-monospace, "SF Mono", Consolas, monospace; white-space: pre-wrap; }
  #python { background: #0f1b2d; color: #e6edf7; border-radius: var(--r); }
  #output { border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); }
  #output .err { color: var(--bad); }
</style>
</head>
<body>
  <div class="bar">
    <button class="primary" id="run">▶ Run</button>
    <span class="grow note">Drag blocks from the left. The Python updates as you build.</span>
    <button id="example">Example</button>
    <button id="clear">Clear</button>
  </div>
  <div class="main">
    <div id="blocks"></div>
    <div class="side">
      <div class="label">The same program in Python</div>
      <pre id="python"></pre>
      <div class="label">Output</div>
      <pre id="output"></pre>
    </div>
  </div>

<!-- Blockly (Apache 2.0, Google): see blockly/NOTICE.txt -->
<script src="blockly/blockly_compressed.js"></script>
<script src="blockly/blocks_compressed.js"></script>
<script src="blockly/javascript_compressed.js"></script>
<script src="blockly/python_compressed.js"></script>
<script src="blockly/msg-en.js"></script>
<script>
  // The blocks students can use: loops, logic, math, text and variables.
  const toolbox = {
    kind: "categoryToolbox",
    contents: [
      { kind: "category", name: "Loops", colour: "120", contents: [
        { kind: "block", type: "controls_repeat_ext", inputs: { TIMES: { shadow: { type: "math_number", fields: { NUM: 3 } } } } },
        { kind: "block", type: "controls_whileUntil" },
        { kind: "block", type: "controls_for", inputs: {
          FROM: { shadow: { type: "math_number", fields: { NUM: 1 } } },
          TO: { shadow: { type: "math_number", fields: { NUM: 5 } } },
          BY: { shadow: { type: "math_number", fields: { NUM: 1 } } } } },
      ] },
      { kind: "category", name: "Logic", colour: "210", contents: [
        { kind: "block", type: "controls_if" }, { kind: "block", type: "logic_compare" },
        { kind: "block", type: "logic_operation" }, { kind: "block", type: "logic_boolean" },
      ] },
      { kind: "category", name: "Math", colour: "230", contents: [
        { kind: "block", type: "math_number" }, { kind: "block", type: "math_arithmetic" },
        { kind: "block", type: "math_modulo" }, { kind: "block", type: "math_random_int", inputs: {
          FROM: { shadow: { type: "math_number", fields: { NUM: 1 } } },
          TO: { shadow: { type: "math_number", fields: { NUM: 6 } } } } },
      ] },
      { kind: "category", name: "Text", colour: "160", contents: [
        { kind: "block", type: "text_print", inputs: { TEXT: { shadow: { type: "text", fields: { TEXT: "Hello!" } } } } },
        { kind: "block", type: "text" }, { kind: "block", type: "text_join" },
      ] },
      { kind: "category", name: "Variables", colour: "330", custom: "VARIABLE" },
    ],
  };

  const workspace = Blockly.inject("blocks", {
    toolbox: toolbox,
    zoom: { controls: true, startScale: 1.15, wheel: true },
    trashcan: true,
    sounds: false,
    media: "blockly/media/",
    grid: { spacing: 24, length: 2, colour: "#e3e8ef", snap: true },
  });

  // The starting example: count to 5, and say which numbers are even.
  const EXAMPLE = {
    blocks: { languageVersion: 0, blocks: [{
      type: "controls_for", x: 20, y: 20, fields: { VAR: { name: "n" } },
      inputs: {
        FROM: { shadow: { type: "math_number", fields: { NUM: 1 } } },
        TO: { shadow: { type: "math_number", fields: { NUM: 5 } } },
        BY: { shadow: { type: "math_number", fields: { NUM: 1 } } },
        DO: { block: {
          type: "controls_if", extraState: { hasElse: true },
          inputs: {
            IF0: { block: { type: "logic_compare", fields: { OP: "EQ" }, inputs: {
              A: { block: { type: "math_modulo", inputs: {
                DIVIDEND: { block: { type: "variables_get", fields: { VAR: { name: "n" } } } },
                DIVISOR: { shadow: { type: "math_number", fields: { NUM: 2 } } } } } },
              B: { block: { type: "math_number", fields: { NUM: 0 } } } } } },
            DO0: { block: { type: "text_print", inputs: { TEXT: { block: { type: "text_join", extraState: { itemCount: 2 }, inputs: {
              ADD0: { block: { type: "variables_get", fields: { VAR: { name: "n" } } } },
              ADD1: { block: { type: "text", fields: { TEXT: " is even" } } } } } } } } },
            ELSE: { block: { type: "text_print", inputs: { TEXT: { block: { type: "text_join", extraState: { itemCount: 2 }, inputs: {
              ADD0: { block: { type: "variables_get", fields: { VAR: { name: "n" } } } },
              ADD1: { block: { type: "text", fields: { TEXT: " is odd" } } } } } } } } },
          } } },
      } }] },
    variables: [{ name: "n", id: "n" }],
  };
  function load(state) { workspace.clear(); Blockly.serialization.workspaces.load(state, workspace); }
  load(EXAMPLE);

  // Show the Python version whenever the blocks change.
  const pythonBox = document.getElementById("python");
  function showPython() {
    const code = python.pythonGenerator.workspaceToCode(workspace).replace(/\n{3,}/g, "\n\n").trim();
    pythonBox.textContent = code || "# Drag some blocks in!";
  }
  workspace.addChangeListener(function (e) { if (!e.isUiEvent) showPython(); });
  showPython();

  // Run: the blocks as JavaScript, with print() writing to the Output box. A loop that runs too
  // long is stopped.
  const out = document.getElementById("output");
  document.getElementById("run").onclick = function () {
    out.textContent = "";
    const gen = javascript.javascriptGenerator;
    gen.INFINITE_LOOP_TRAP = "if (--__steps < 0) throw new Error('The program ran too long (an endless loop?)');\n";
    let lines = 0;
    function print(text) { if (lines++ < 200) out.append(String(text) + "\n"); }
    try {
      const code = gen.workspaceToCode(workspace).replace(/window\.alert\(/g, "print(");
      new Function("print", "let __steps = 100000;\n" + code)(print);
      if (!out.textContent) out.textContent = "(Nothing printed. Add a print block from Text.)";
    } catch (err) {
      const e = document.createElement("span"); e.className = "err"; e.textContent = "Error: " + err.message; out.append(e);
    }
    gen.INFINITE_LOOP_TRAP = null;
  };
  document.getElementById("example").onclick = function () { load(EXAMPLE); out.textContent = ""; };
  document.getElementById("clear").onclick = function () { workspace.clear(); out.textContent = ""; };
</script>
</body>
</html>
