<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Robot lifts</title>
<link rel="stylesheet" href="embed.css">
<style>
  .main { flex: 1; min-height: 0; display: grid; grid-template-columns: 1fr 250px; gap: 10px; }
  svg { width: 100%; height: 100%; min-height: 0; border: 1px solid var(--line); border-radius: var(--r); background: #fbfcfe; }
  .panel { display: flex; flex-direction: column; gap: 6px; padding: 8px; overflow: auto; font-size: 15px; }
  .big { font-size: 25px; font-weight: 700; line-height: 1.1; font-variant-numeric: tabular-nums; }
  .stat { padding: 8px 10px; border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--surface); }
  .stat small { display: block; color: var(--muted); font-size: 13px; font-weight: 700; letter-spacing: 0.03em; text-transform: uppercase; }
  .ok { color: var(--ok); font-weight: 700; }
  .over { border-color: var(--bad); background: #fbecec; }
  #widest, #start { display: block; font-size: 15px; }
  .rules { font-size: 14px; color: var(--muted); }
  .over .big, .bad { color: var(--bad); font-weight: 700; }
  label.row { display: grid; gap: 2px; font-weight: 600; }
  #about { font-size: 15px; }
</style>
</head>
<body>
  <div class="bar">
    <button data-mode="four">4-bar</button>
    <button data-mode="six">6-bar</button>
    <button data-mode="dr4b">DR4B</button>
    <span class="grow"></span>
    <button class="primary" id="play">▶ Lift</button>
  </div>
  <div class="main">
    <svg id="svg" viewBox="0 0 900 600" aria-label="A robot lift"></svg>
    <div class="panel box">
      <div class="stat"><small id="heightLabel">Extension</small><span class="big" id="ext"></span></div>
      <div class="stat"><small>The claw</small>Height off the floor: <b id="height"></b><br>Moves forward: <b id="reach"></b></div>
      <div class="stat" id="lengthBox"><small>Robot length (back to front)</small><span class="big" id="length"></span>
        <span id="start"></span><span id="widest"></span>
        <span class="rules">Rules: start within 20 in, never wider than 24 in. No height limit.</span></div>
      <label class="row">Lift <input type="range" id="lift" min="0" max="100" value="0"></label>
      <label class="row">Bar length: <span id="lenV"></span><input type="range" id="len" min="15" max="40" value="25"></label>
      <div id="about" class="note"></div>
    </div>
  </div>

<script>
  /*
    Three lifts made of parallelograms (two equal bars, the same distance apart at both ends), so
    the end of each stage stays upright and the claw stays level.
      4-bar: one stage, from the tower to the claw. The claw swings up in an arc.
      6-bar: two stages stacked, both tilted the same way: about twice the height of a 4-bar.
      DR4B (double reverse four-bar): two stages, the top one tilted the OTHER way, so the claw goes
            straight up. Extension = how far the claw has gone up from its lowest point.
    Sizes are in cm; 1 cm is SCALE drawing units. The size rules are in inches (the game is American),
    so the robot's length shows inches first, then cm.
  */
  const IN = 2.54, START_IN = 20, MAX_IN = 24;   // the robot must start within 20 in and never be wider than 24 in
  const both = function (cm) { return (cm / IN).toFixed(1) + " in (" + cm.toFixed(1) + " cm)"; };
  const SCALE = 8, GROUND = 560, TOWER_X = 260, TOWER_H = 22, GAP = 7;   // tower height, bar spacing (cm)
  const MODES = {
    four: { lo: -30, hi: 60, about: "<b>4-bar:</b> one parallelogram. The claw stays level, but it moves forward and back as it lifts (an arc)." },
    six:  { lo: -15, hi: 40, about: "<b>6-bar:</b> the first 4-bar's top bar is extra long (purple): it keeps going as the second 4-bar's bottom bar. The green end bar is extra tall: it's the tower for the second 4-bar. 6 bars in all. About twice as high, but it also reaches further forward: careful the robot doesn't tip!" },
    dr4b: { about: "<b>DR4B</b> (double reverse four-bar), at the end of the robot with its claw facing out: the top 4-bar tilts the other way, so the claw goes <b>straight up and down</b>, from the floor all the way up, and the robot never gets longer." },
  };
  let mode = "four", t = 0, dir = 1, playing = false, L = 25;
  const svg = document.getElementById("svg");
  const NS = "http://www.w3.org/2000/svg";
  function el(tag, attrs, parent) { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); (parent || svg).append(e); return e; }

  // Static parts: floor, ruler, robot base, tower
  el("rect", { x: 0, y: GROUND, width: 900, height: 40, fill: "#e9edf2" });
  const ruler = el("g", {});
  for (let cm = 0; cm <= 65; cm += 5) {
    const y = GROUND - cm * SCALE;
    el("line", { x1: 862, x2: cm % 10 ? 852 : 844, y1: y, y2: y, stroke: "#8a97a8", "stroke-width": 1.5 }, ruler);
    if (cm % 10 === 0) el("text", { x: 868, y: y + 5, "font-size": 14, fill: "#5b6b80" }, ruler).textContent = cm;
  }
  el("line", { x1: 862, x2: 862, y1: GROUND, y2: GROUND - 65 * SCALE, stroke: "#8a97a8", "stroke-width": 1.5 });
  el("text", { x: 852, y: GROUND - 65 * SCALE - 10, "font-size": 14, fill: "#5b6b80" }).textContent = "cm";
  const BACK = TOWER_X - 110, BASE_W = 260;   // the robot's base: its back edge and length
  // The DR4B sits at the back end of the robot with its claw facing out, so it can reach the floor
  // behind the robot; the others sit in the middle with the claw facing forward.
  const towerX = function () { return mode === "dr4b" ? BACK + 8 : TOWER_X; };
  const FACE = function () { return mode === "dr4b" ? -1 : 1; };
  const OUT = function () { return mode === "dr4b" ? 34 : 0; };   // the claw's bracket: how far out it holds the claw
  el("rect", { x: BACK, y: GROUND - 6 * SCALE, width: BASE_W, height: 4 * SCALE, rx: 6, fill: "#c3ccd8" });
  [TOWER_X - 80, TOWER_X + 120].forEach(function (x) { el("circle", { cx: x, cy: GROUND - 2 * SCALE, r: 2 * SCALE, fill: "#5b6b80" }); });
  const towerRect = el("rect", { x: TOWER_X - 8, y: GROUND - (TOWER_H + 3) * SCALE, width: 16, height: (TOWER_H - 3) * SCALE, rx: 3, fill: "#8a97a8" });

  // Moving parts
  const path = el("polyline", { fill: "none", stroke: "#d6458f", "stroke-width": 2, "stroke-dasharray": "5 5", opacity: 0.7 });
  const g = el("g", {});
  const dim = el("g", {});
  function bar(p, q, color) { el("line", { x1: p[0], y1: p[1], x2: q[0], y2: q[1], stroke: color, "stroke-width": 9, "stroke-linecap": "round" }, g); }
  function pin(p) { el("circle", { cx: p[0], cy: p[1], r: 5, fill: "#fff", stroke: "#10233f", "stroke-width": 2.5 }, g); }
  function upright(top, bottom, color) { bar(top, bottom, color); }

  // The joints for an angle a (degrees above level). Returns the claw's mount (top and bottom).
  function solve(a) {
    const r = a * Math.PI / 180, dx = L * SCALE * Math.cos(r), dy = -L * SCALE * Math.sin(r);
    const T1 = [towerX(), GROUND - (TOWER_H + 1) * SCALE], T2 = [towerX(), T1[1] + GAP * SCALE];   // the tower's two pivots
    const M1 = [T1[0] + dx, T1[1] + dy], M2 = [T2[0] + dx, T2[1] + dy];                           // end of stage 1
    if (mode === "four") return { stages: [[T1, T2, M1, M2]], end: [M1, M2] };
    if (mode === "six") {
      // VEX's 6-bar: stage 1's top bar is twice as long and keeps going as stage 2's bottom bar
      // (T1 → M1 → E2, one straight bar). Stage 1's end bar is extra tall (M2 up past M1 to M3):
      // it's the "tower" for stage 2's top bar (M3 → E1). The tall bar crosses the long bar: the X.
      const M3 = [M1[0], M1[1] - GAP * SCALE];
      const E2 = [M1[0] + dx, M1[1] + dy], E1 = [M3[0] + dx, M3[1] + dy];
      return { six: { T1: T1, T2: T2, M1: M1, M2: M2, M3: M3 }, stages: [[T1, T2, M1, M2], [M3, E1, E2]], end: [E1, E2] };
    }
    const back = mode === "dr4b" ? -1 : 1;   // DR4B: the top stage points back
    const E1 = [M1[0] + back * dx, M1[1] + dy], E2 = [M2[0] + back * dx, M2[1] + dy];
    return { stages: [[T1, T2, M1, M2], [M1, M2, E1, E2]], end: [E1, E2] };
  }
  // How far the robot reaches, front and back, in one pose: the base, every pin, and the claw's fingers.
  function span(s) {
    let pts = [].concat.apply([], s.stages).concat(s.end);
    if (s.six) pts = pts.concat([s.six.T1, s.six.T2, s.six.M1, s.six.M2, s.six.M3]);
    const xs = pts.map(function (p) { return p[0]; }).concat([BACK, BACK + BASE_W, s.end[1][0] + FACE() * (OUT() + 50)]);
    return { back: Math.min.apply(null, xs), front: Math.max.apply(null, xs) };
  }
  function length(sp) { return (sp.front - sp.back) / SCALE; }
  let widest = null, startLen = 0, origin = 0;   // the widest pose in the full swing ({ len, x, at }), the length at the start, where the limits are measured from
  function findWidest() {
    widest = null; origin = Infinity;
    for (let p = 0; p <= 100; p += 1) {
      const sp = span(solve(angle(p))), n = length(sp);
      if (!widest || n > widest.len) widest = { len: n, x: sp.front, at: p };
      if (p === 0) startLen = n;
      origin = Math.min(origin, sp.back);
    }
  }
  function clawPoint(s) { return [s.end[0][0] + FACE() * (OUT() + 26), s.end[1][1]]; }   // the claw's grip, level with the lower pin
  function range() {
    if (mode !== "dr4b") return MODES[mode];
    // lowest: the claw just above the floor (the lower pivot is TOWER_H + 1 - GAP cm up, and the
    // claw drops two bar lengths × sin); highest: the top pin still inside the picture (66 cm)
    const low = TOWER_H + 1 - GAP, deg = function (x) { return Math.asin(Math.max(-1, Math.min(1, x))) * 180 / Math.PI; };
    return { lo: -deg((low - 1) / (2 * L)), hi: Math.min(75, deg((66 - GAP - low) / (2 * L))) };
  }
  const angle = function (p) { const m = range(); return m.lo + (m.hi - m.lo) * p / 100; };

  function draw() {
    const a = angle(t), s = solve(a);
    g.textContent = ""; dim.textContent = "";
    const colors = ["#0087ff", "#ff8c0f"];
    if (s.six) {   // 6 bars: the long shared bar (purple), stage 1's bottom bar, the tall middle bar, stage 2's top bar
      const k = s.six;
      bar(k.T2, k.M2, "#0087ff");
      upright([k.M2[0], k.M2[1] + 10], [k.M3[0], k.M3[1] - 10], "#2e9e4f");
      bar(k.T1, s.end[1], "#7b4fc9");
      bar(k.M3, s.end[0], "#ff8c0f");
    } else s.stages.forEach(function (st, i) {
      bar(st[0], st[2], colors[i]); bar(st[1], st[3], colors[i]);
    });
    if (s.stages.length > 1 && !s.six) upright([s.stages[0][2][0], s.stages[0][2][1] - 10], [s.stages[0][3][0], s.stages[0][3][1] + 10], "#2e9e4f");   // the middle link
    // the claw: an upright plate with two level fingers
    const [e1, e2] = s.end, f = FACE(), px = e2[0] + f * OUT();
    upright([e1[0], e1[1] - 8], [e2[0], e2[1] + 8], "#10233f");
    if (OUT()) bar([e1[0], e1[1]], [px, e1[1]], "#10233f"), bar([e2[0], e2[1]], [px, e2[1]], "#10233f"), upright([px, e1[1] - 8], [px, e2[1] + 8], "#10233f");
    el("path", { d: `M${px} ${e2[1]} h${46 * f} M${px} ${e2[1] - 26} h${46 * f}`, stroke: "#10233f", "stroke-width": 7, "stroke-linecap": "round", fill: "none" }, g);
    el("rect", { x: f > 0 ? px + 14 : px - 40, y: e2[1] - 24, width: 26, height: 22, rx: 3, fill: "#ffc61a", stroke: "#b8860b" }, g);   // a cube
    s.stages.forEach(function (st) { st.forEach(pin); });
    // the motor, on the tower's lower pivot
    el("circle", { cx: s.stages[0][1][0], cy: s.stages[0][1][1], r: 13, fill: "none", stroke: "#10233f", "stroke-width": 2, "stroke-dasharray": "4 3" }, g);

    // the robot's length along the floor, the widest point in the swing, and the two size limits:
    // 20 in at the start, 24 in at any time (measured from the robot's back-most point; height doesn't count)
    const sp = span(s), yy = GROUND + 24;
    [[START_IN, "#e07b00", "start: 20 in (50.8 cm)", 30], [MAX_IN, "#c23b3b", "max: 24 in (61.0 cm)", 52]].forEach(function (lim) {
      const x = origin + lim[0] * IN * SCALE;
      el("line", { x1: x, x2: x, y1: lim[3] - 16, y2: GROUND + 40, stroke: lim[1], "stroke-width": 2.5, "stroke-dasharray": "8 6" }, dim);
      el("text", { x: x + 6, y: lim[3], "font-size": 15, "font-weight": 700, fill: lim[1] }, dim).textContent = lim[2];
    });
    el("line", { x1: sp.back, x2: sp.front, y1: yy, y2: yy, stroke: "#10233f", "stroke-width": 2.5, "marker-start": "url(#arrowDark)", "marker-end": "url(#arrowDark)" }, dim);
    el("text", { x: (sp.back + sp.front) / 2 - 34, y: yy - 6, "font-size": 15, "font-weight": 700, fill: "#10233f" }, dim).textContent = (length(sp) / IN).toFixed(1) + " in";
    if (widest) {
      el("line", { x1: widest.x, x2: widest.x, y1: GROUND - 2, y2: GROUND + 36, stroke: "#ff8c0f", "stroke-width": 3 }, dim);
      el("text", { x: widest.x + 5, y: GROUND + 36, "font-size": 13, "font-weight": 700, fill: "#b85d00" }, dim).textContent = "widest";
    }
    const over = length(sp) > MAX_IN * IN + 0.05, overEver = widest && widest.len > MAX_IN * IN + 0.05, overStart = startLen > START_IN * IN + 0.05;
    document.getElementById("length").textContent = both(length(sp));
    document.getElementById("lengthBox").classList.toggle("over", over);
    document.getElementById("start").innerHTML = "At the start: <b class=\"" + (overStart ? "bad" : "ok") + "\">" + both(startLen) +
      (overStart ? ", over 20 in" : " ✓") + "</b>";
    document.getElementById("widest").innerHTML = widest ? "Widest in the full swing: <b class=\"" + (overEver ? "bad" : "ok") + "\">" +
      both(widest.len) + (overEver ? ", over 24 in by " + (widest.len / IN - MAX_IN).toFixed(1) + " in" : " ✓") + "</b>" : "";

    // numbers
    const low = clawPoint(solve(angle(0))), now = clawPoint(s);
    const ext = (low[1] - now[1]) / SCALE, height = (GROUND - now[1]) / SCALE, reach = (now[0] - low[0]) / SCALE;
    document.getElementById("ext").textContent = ext.toFixed(1) + " cm";
    document.getElementById("height").textContent = height.toFixed(1) + " cm";
    document.getElementById("reach").textContent = mode === "dr4b" ? "0 cm: straight up ✓" : (reach > 0.05 ? "+" : "") + reach.toFixed(1) + " cm";
    // the extension, measured beside the claw: from its lowest point to now
    const x = FACE() > 0 ? Math.min(Math.max(now[0], low[0]) + 90, 760) : 34;
    el("line", { x1: FACE() > 0 ? x - 70 : x - 10, x2: FACE() > 0 ? x + 10 : low[0] - 30, y1: low[1], y2: low[1], stroke: "#7b4fc9", "stroke-dasharray": "4 4" }, dim);
    el("line", { x1: now[0] + FACE() * 50, x2: x + 10, y1: now[1], y2: now[1], stroke: "#7b4fc9", "stroke-dasharray": "4 4" }, dim);
    if (ext > 1) {
      el("line", { x1: x, x2: x, y1: low[1] - 2, y2: now[1] + 2, stroke: "#7b4fc9", "stroke-width": 3, "marker-start": "url(#arrow)", "marker-end": "url(#arrow)" }, dim);
      el("text", { x: x + 12, y: (low[1] + now[1]) / 2 + 6, "font-size": 20, "font-weight": 700, fill: "#7b4fc9" }, dim).textContent = ext.toFixed(1) + " cm";
    }
  }
  // arrow heads for the measurement
  const defs = el("defs", {});
  const marker = el("marker", { id: "arrow", viewBox: "0 0 10 10", refX: 5, refY: 5, markerWidth: 5, markerHeight: 5, orient: "auto-start-reverse" }, defs);
  el("path", { d: "M0 0 L10 5 L0 10 z", fill: "#7b4fc9" }, marker);
  const marker2 = el("marker", { id: "arrowDark", viewBox: "0 0 10 10", refX: 5, refY: 5, markerWidth: 5, markerHeight: 5, orient: "auto-start-reverse" }, defs);
  el("path", { d: "M0 0 L10 5 L0 10 z", fill: "#10233f" }, marker2);

  function tracePath() {   // the claw's whole path, from bottom to top (and the widest pose)
    findWidest();
    const pts = [];
    for (let p = 0; p <= 100; p += 2) pts.push(clawPoint(solve(angle(p))).join(","));
    path.setAttribute("points", pts.join(" "));
  }
  function setMode(m) {
    mode = m;
    towerRect.setAttribute("x", towerX() - 8);
    len.max = m === "six" ? 28 : 40;   // a 6-bar with longer bars would go off the picture
    if (L > +len.max) { L = +len.max; len.value = L; document.getElementById("lenV").textContent = L + " cm"; }
    document.querySelectorAll("[data-mode]").forEach(function (b) { b.classList.toggle("on", b.dataset.mode === m); });
    document.getElementById("about").innerHTML = MODES[m].about;
    tracePath(); draw();
  }
  document.querySelectorAll("[data-mode]").forEach(function (b) { b.onclick = function () { setMode(b.dataset.mode); }; });
  const lift = document.getElementById("lift"), len = document.getElementById("len"), play = document.getElementById("play");
  lift.oninput = function () { t = +lift.value; playing = false; play.textContent = "▶ Lift"; draw(); };
  len.oninput = function () { L = +len.value; document.getElementById("lenV").textContent = L + " cm"; tracePath(); draw(); };
  play.onclick = function () { playing = !playing; play.textContent = playing ? "❚❚ Stop" : "▶ Lift"; };
  document.getElementById("lenV").textContent = L + " cm";

  // Play: up to the top, a pause, back down, a pause
  let wait = 0;
  (function loop() {
    if (playing) {
      if (wait > 0) wait--;
      else {
        t += dir * 0.6;
        if (t >= 100 || t <= 0) { t = Math.max(0, Math.min(100, t)); dir = -dir; wait = 50; }
        lift.value = t; draw();
      }
    }
    requestAnimationFrame(loop);
  })();
  setMode(new URLSearchParams(location.search).get("mode") || "four");
</script>
</body>
</html>
