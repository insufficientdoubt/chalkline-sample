# Builds the TEACHER version of the site on every push to main and publishes it to GitHub Pages:
#   https://insufficientdoubt.github.io/project-chalkline/
# (This sample is all demo content, so its teacher version, with answer keys, is fine to show publicly.
#  Don't publish a real course's teacher version this way: GitHub Pages sites are public.)

name: Publish teacher site

on:
  push:
    branches: [main]
  workflow_dispatch:          # or run it by hand: Actions tab > Publish teacher site > Run workflow

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Python packages
        run: pip install -r requirements.txt

      - name: Chinese font for slide PDFs (the project's own Noto Sans SC, so nothing to download)
        run: |
          mkdir -p ~/.local/share/fonts
          cp brand/fonts/print/*.otf ~/.local/share/fonts/
          fc-cache -f
          fc-list | grep -i "Noto Sans SC"

      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.10.19     # same version as on our computers

      - name: Build the teacher site
        run: |
          export QUARTO_PYTHON="$(which python)"
          quarto render --profile teacher

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site-teacher

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
