# Teacher profile. Used only when you run:  quarto render --profile teacher
# These settings are layered on top of _quarto.yml.
#
# Anything wrapped in  ::: {.content-visible when-profile="teacher"}  shows up
# only in this build (answer keys, teacher notes).

project:
  output-dir: _site-teacher  # keep teacher files separate so they never get mixed up

website:
  title: "Chalkline Sample (TEACHER)"

edition: Teacher Edition       # printed on the corner tab of teacher PDFs

pdf-viewer:                    # slides show the student copy of a PDF (no answer keys) when there is one:
  prefer: "{name}-student.pdf" # scripts/packets.py writes it next to the teacher edition. To show the
                               # teacher edition on a slide (say, for training), add prefer=false to it.
